[[items]]
title = "Metabolinden"
subtitle = "Nextflow"
content = "A metabolomics preprocessing workflow for iterative parameter optimization using internal standards and repeated sample injections."
tags = ["Metabolomics", "Quality control", "Nextflow"]
link = "https://github.com/PayamEmami/nf-core-metabolinden"

[[items]]
title = "MetaboRAID"
subtitle = "R package"
